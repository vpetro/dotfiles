geometry=75%x75%+100+200
autofit-larger=50%x50%
ontop=no
border=no
mute=yes


script-opts-append=ytdl_hook-ytdl_path=/opt/homebrew/bin/yt-dlp
ytdl-format=bestvideo[height<=1080][protocol=https]+bestaudio[protocol=https]/bestvideo[height<=1080]+bestaudio/best[height<=1080]
stream-lavf-o=request_size=1048576,multiple_requests=1


